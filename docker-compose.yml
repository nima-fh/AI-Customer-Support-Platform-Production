services:

  postgres:
    image: postgres:17
    container_name: support-ai-postgres

    environment:
      POSTGRES_DB: support_ai
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: support_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: